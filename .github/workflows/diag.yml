name: diag
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.8.2"}
      - run: chmod +x gradlew && ./gradlew build --no-daemon || true
      - if: always()
        run: |
          JAR=$(find ~/.gradle /home/runner -name "minecraft-merged*.jar" 2>/dev/null | head -1)
          echo "JAR=$JAR"
          javap -classpath "$JAR" net.minecraft.client.gui.GuiGraphicsExtractor | grep -i tooltip
          echo "=== GuiGraphics ==="
          javap -classpath "$JAR" net.minecraft.client.gui.GuiGraphics | grep -i tooltip | head
